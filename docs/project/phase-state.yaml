    TWO FINDINGS CAME OUT OF EXECUTION. (1) The plan's routing lever - a
    translator returning a single space - does NOT reach layer 6: per_kind
    rejects any segment whose chars are all char::is_whitespace, a check
    written for exactly that attack. Defense in depth, working. The lever that
