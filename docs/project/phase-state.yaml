    THE PANE DERIVATION is strip -> inject into the block's own element ->
    balance -> group consecutive li, in a child of render so PaneCtx and its
    three refusals are LITERALLY reused rather than imitated. The transparent
    div survives for html-kind blocks and element-less ones (an img-run
    included: a void records no extent, so the instrument has nothing for
    injection to land in). That key is the ti d4bce2 re-keying and its ground
    is MEASURED: DOMPurify removes an unknown element AND every attribute
    riding it, so an anchor injected into <x-note> dies at the mount and the
    pane grows a hole. The earlier "is it named in section 4's tables" key
    closed that for custom elements but left iframe and noscript
    self-injecting, since both are NAMED default-stop entries the sanitizer
    also removes - and patching that would have meant naming which entries
    the sanitizer keeps, i.e. a second opinion about what DOMPurify accepts.
    Keying on the KIND refuses that too and needs no list at all. Neutralize
    the key and the test prints the defect: the anchor spliced into the very
    tag the sanitizer deletes.
