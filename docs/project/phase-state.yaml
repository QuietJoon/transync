    AST-direct: one comrak parse per pane instead of 2 x (N_blocks +
    N_ol_runs), no per-fragment ref-defs append, strip_outer_wrapper /
    block_inner_html / ordered_list_start DELETED; accepted shape changes are
    loose source lists rendering loose in BOTH panes, comrak's loose-task-item
    shape, and a BUGFIX (4-space-indented code blocks used to render as <p>).
    Two guards: full_reparse per-list item count (defense in depth behind
    per_kind::check_list; NO VALIDATION_SCHEMA_VERSION bump) and a render-side
    degrade that never drops an anchor. Dialect trait deliberately NOT
    instantiated - DCR-0005's deferral condition is still unmet. Alignment
    schema stays 1.2.0; CacheKey and both sync.js copies untouched. Filed
