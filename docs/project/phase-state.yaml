    an EXPLICIT curated re-export list (the facade's transync-syntax
    dependency went with them); transync-core's tier-(c) modules (batch,
    error, pipeline, validate) and the five re-exported syntax aliases
    (align, id, parser, regen, render) went pub(crate), so the tier boundary
    is a COMPILER fact, not a doc claim. One exception: `unit` is
    #[doc(hidden)] pub because transync-openai's offline live_smoke
    fixture-shape test reaches it cross-crate - that reach is now declared as
    engine dev-dependencies. #[non_exhaustive] on nine items (workspace count
    2 -> 11): TranslatorError/TransyncError/ParseError, ProfileMetadata/
    ProfileConstraints/ProfileBatching/ProfileRender, TranslateOptions, and
    TranslationUnit; construction is default-then-assign everywhere except
    TranslationUnit, which got new(unit_id, block_kind, input_mode,
    source_payload, source_hash) + with_context/with_constraints/
    with_batch_id/with_retry (Default is meaningless for it; source_hash is a
    CacheKey axis with no honest zero). Exhaustive-by-policy set unchanged
    (UnitResult, TranslationBatchResult, TranslationBatch, GlossaryEntry).
    pipeline::run_pipeline is unreachable; translate_with_cache is the
    promoted entry point and is NOT a bare alias - it preflights an empty
    target_language and fails fast. contracts.md gained "0. Public Rust
    surface" (78 rows) and crates/transync/tests/public_surface.rs welds
    table and code in six parts: compile-assertion re-export module,
    DOCUMENTED mirror, table <-> DOCUMENTED scrape equality, first_class <->
    DOCUMENTED self-scrape equality, segment-based negative test over the
    hidden module names, and a DCR-0017 M6 generator.version guard. DCR-0017's handover list is closed: htmlseg::balance_fragment /
    outcome::is_translatable / walk::label_for went pub(crate), and cargo doc
    --no-deps is warning-free for all three library crates under a STANDING
    RUSTDOCFLAGS="-D warnings" gate in scripts/smoke.sh. Closure fallout
    resolved with ZERO test removals and zero new #[allow]s: retry's three
    no-op hooks (retry_validation, oversize_split, fallback_to_source),
    batch::group_by_unit_count (with its pre-existing #[allow(dead_code)]),
    and ValidatedBatch::batch_id_str DELETED (greppable tombstone comment);
    batch::estimate_unit_tokens + validate::schema::check_schema -> #[cfg(test)].
    OI-0008 STILL owns the retry/fallback redesign - empty hooks are not the
    policy fix. Owner-decision corrections recorded in DCR-0018: the
    2026-08-03 decision's "construction via ..Default::default()" was UNSOUND
    (FRU is illegal cross-crate on non_exhaustive structs; re-decided as
    default-then-assign 2026-08-04), and tier (a)'s "TranslateOutput" is a
    naming slip for TranslationOutput (no rename happened). Sibling repo
    /Volumes/Common/QJoon/resp-translator migrated the same day (commit
    8b6dbd5, branch main): run_pipeline -> translate_with_cache +
    default-then-assign, with the behavioral delta that an empty profile
    target_language now fails fast with stable_code "internal". DISCOVERY:
    the tracked pre-commit hook was NOT live - core.hooksPath was unset, so
    only .git/hooks/pre-commit ran; install-hooks.sh set
    core.hooksPath=scripts/hooks and the .git/hooks copy is now inert but
    kept byte-identical. Invariants held: alignment schema stays 1.2.0,
    VALIDATION_SCHEMA_VERSION stays 2, CacheKey and both sync.js copies
    untouched. Gates: 340 passed / 0 failed / 3 ignored workspace-wide at
    --test-threads=4, Playwright SCN-13 8/8. Released as v0.2.0 (see top).
    transync-syntax crate split + AST-direct renderer LANDED 2026-08-04
    (DCR-0017); OI-0028 RESOLVED, OI-0008 narrowed. crates/transync-syntax is
    the workspace's fifth member and owns parser (+ranges/refdefs), id, regen,
    render (+attrs), align, htmlseg, error::ParseError, plus two new modules:
    outcome (the per-block HtmlOutcome closure) and walk (ONE shared top-level
    normalization + per-list item count, consumed by the render zip AND
    validate::full_reparse). transync-core keeps pipeline/unit/batch/llm/
    validate/cache/profile and re-exports the moved modules, so no consumer
    path broke; the facade also gained `pub use transync_syntax;`. Standing
    gate: cargo check -p transync-syntax --target wasm32-unknown-unknown, in
    both pre-commit hook copies (fails loudly, never skips, when the rustup
    target is missing) and scripts/smoke.sh. Dependency canary re-run for the
